
[programs]
	#Shortest allowed EVERY interval, in ticks. Programs below it do not compile.
	#Range: 1 ~ 72000
	minTriggerIntervalTicks = 20

[networks]
	#Most cables (managers included) one network may contain. Bigger networks stop growing.
	#Range: 1 ~ 1000000
	maxCablesPerNetwork = 2048
	#Most labelled block positions one label gun or disk may hold, to keep item NBT small.
	#Range: 1 ~ 100000
	maxLabelledPositions = 256

[performance]
	#Average time, in microseconds, one manager may spend per program run before it pauses itself.
	#Range: 1 ~ 1000000
	managerBudgetMicros = 2000
	#Program runs a manager must have before its average can pause it.
	#Range: 1 ~ 1000
	managerBudgetMinRuns = 5
	#Total time, in microseconds, all managers together may use per server tick. Managers past it skip that tick.
	#Range: 1 ~ 1000000
	globalTickBudgetMicros = 10000
	#Most managers one player may have placed at once. 0 disables the limit.
	#Range: 0 ~ 100000
	maxManagersPerPlayer = 16

