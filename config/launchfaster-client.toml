
[optimizations]
	#Parallelizes block model and blockstate JSON file I/O using the background executor pool.
	#Inspired by 1.21.1's ModelManager.reload() CompletableFuture pipeline.
	parallelModelLoading = false
	#Stitches all texture atlases in parallel instead of sequentially.
	#Inspired by 1.21.1's AtlasSet.scheduleLoad() returning parallel futures.
	parallelAtlasStitching = false
	#Bakes all top-level models in parallel using the background executor pool.
	#Uses ConcurrentHashMap for the baked cache to allow safe concurrent baking.
	parallelModelBaking = false
	#Enables a preparation barrier so all reload listeners can prepare() in parallel.
	#Inspired by 1.21.1's PreparationBarrier wiring the unused allPreparations field.
	reloadListenerBarrier = true
	#Skips the 2nd and 3rd redundant calls to ForgeRegistry.validateContent().
	#Forge calls this 3x per registry during startup. Only the final validation is kept.
	skipRedundantRegistryValidation = true
	#Short-circuits ForgeRegistry.dump() to avoid building debug tables.
	#The dump table is expensive to build even when debug logging is disabled.
	skipRegistryDumpInProduction = true
	#Parallelizes BlockState.initCache() calls during Block registry bake.
	#Uses ForkJoinPool to init caches across multiple cores.
	#Ignored if lazyBlockStateCache is enabled.
	parallelBlockStateInit = true
	#Defers BlockState.initCache() until first property access instead of computing eagerly.
	#Avoids computing caches for blockstates never accessed during init.
	#Takes priority over parallelBlockStateInit when enabled.
	lazyBlockStateCache = true
	#Fetches the user profile asynchronously on the IO pool instead of blocking startup.
	#Inspired by 1.21.1's CompletableFuture.supplyAsync for profile fetching.
	asyncProfileFetch = true
	#Caches the result of BlockModel.getMaterials() to avoid redundant parent-chain walks.
	#With 61K+ models sharing parents, this avoids thousands of repeated traversals.
	memoizeModelMaterials = true
	#Caches ResourceManager.listResources() results by prefix and filter predicate.
	#Avoids redundant traversals of all mod jars for repeated queries with the same parameters.
	#Cache is invalidated on resource reload.
	cacheResourceListing = true
	#Displays the total launch time in the log and chat on world join.
	showLaunchTimer = true

